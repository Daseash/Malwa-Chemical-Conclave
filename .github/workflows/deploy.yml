name: Deploy MCC to IIT CloudPanel

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mcc-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy application
        shell: bash
        run: |
          set -e

          SITE_PATH="/home/iiti-mcc/htdocs/mcc.iiti.ac.in/Malwa-Chemical-Conclave"

          echo "======================================"
          echo "MCC Deployment Started"
          echo "======================================"

          cd "$SITE_PATH"

          echo "Current directory:"
          pwd

          echo "Fetching latest code..."
          git fetch origin main

          echo "Resetting to latest main..."
          git reset --hard origin/main

          echo "Installing dependencies..."
          npm ci

          echo "Building Next.js application..."
          npm run build

          echo "Ensuring MongoDB process is running on port 27018..."
          if ! pgrep -f "port 27018" > /dev/null; then
            echo "Starting MongoDB on port 27018..."
            /usr/bin/mongod --dbpath /home/iiti-mcc/mongodb_data --port 27018 --bind_ip 127.0.0.1 --fork --logpath /home/iiti-mcc/mongodb.log || true
          fi

          echo "Restarting PM2 application..."
          if pm2 describe mcc > /dev/null 2>&1; then
            echo "Process 'mcc' found. Restarting..."
            pm2 restart mcc --update-env
          else
            echo "Process 'mcc' not found. Starting fresh..."
            pm2 start ecosystem.config.cjs || pm2 start npm --name "mcc" -- start
          fi

          echo "Saving PM2 process list..."
          pm2 save

          echo "Checking PM2 status..."
          pm2 status

          echo "Verifying local HTTP response..."
          sleep 3
          curl -s -I http://127.0.0.1:3030 || echo "Note: Port 3030 warming up..."

          echo "PM2 Recent Logs:"
          pm2 logs mcc --lines 30 --nostream || true

          echo "======================================"
          echo "MCC Deployment Completed"
          echo "======================================"
